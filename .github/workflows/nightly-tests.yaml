# Nightly test workflow.
# Runs the full CI test suite every night to catch issues early.
# Helps detect problems with dependencies or external changes.

name: Nightly Tests
on:
  schedule:
    - cron: '10 9 * * *' # Run at 9:10 AM UTC daily
  workflow_dispatch:  # to trigger manually

permissions:
  contents: read

jobs:
  # Validate package can be built and installed correctly
  build:
    uses: ./.github/workflows/build.yaml

  # Check for circular import dependencies
  cyclic-imports:
    uses: ./.github/workflows/cyclic-imports.yaml

  # Run doctests on code examples
  doctest:
    uses: ./.github/workflows/doctest.yaml
    secrets: inherit

  # Verify code formatting and linting
  format:
    uses: ./.github/workflows/format.yaml

  # Verify the example notebooks execute without errors
  notebooks:
    uses: ./.github/workflows/notebooks.yaml

  # Run pre-commit hooks for code quality
  pre-commit:
    uses: ./.github/workflows/pre-commit.yaml

  # Check type annotations with pyright
  type-checking:
    uses: ./.github/workflows/type-checking.yaml

  # Run unit and integration tests across multiple Python versions and OS
  test:
    uses: ./.github/workflows/test.yaml

  # Test compatibility with different dependency versions
  test-deps:
    uses: ./.github/workflows/test-deps.yaml
