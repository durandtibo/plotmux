name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch:  # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@v0.1.0

      - name: check plotmux
        run: |
          python -c "import plotmux"

      - name: check plotmux.backends
        run: |
          python -c "from plotmux import backends"

      - name: check plotmux.colors
        run: |
          python -c "from plotmux import colors"

      - name: check plotmux.specs
        run: |
          python -c "from plotmux import specs"

      - name: check plotmux.testing
        run: |
          python -c "from plotmux import testing"

      - name: check plotmux.utils
        run: |
          python -c "from plotmux import utils"
